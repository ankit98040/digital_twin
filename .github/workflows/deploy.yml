name: Deploy Digital Twin

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Digital Twin
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "❌ ERROR: AWS_ROLE_ARN secret is missing in GitHub Repository Secrets!"
            echo "Please set AWS_ROLE_ARN under Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "✅ AWS_ROLE_ARN is configured."

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEFAULT_AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Deployment Script
        run: |
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION || 'us-east-1' }}
          
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh ${{ github.event.inputs.environment || 'dev' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get Deployment Outputs
        id: deploy_outputs
        working-directory: ./terraform
        run: |
          ENV_TARGET="${{ github.event.inputs.environment || 'dev' }}"
          terraform workspace select $ENV_TARGET || terraform workspace new $ENV_TARGET
          echo "cloudfront_url=$(terraform output -raw cloudfront_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw s3_frontend_bucket 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront Cache
        run: |
          FRONTEND_BUCKET="${{ steps.deploy_outputs.outputs.frontend_bucket }}"
          AWS_REGION="${{ secrets.DEFAULT_AWS_REGION || 'us-east-1' }}"
          
          if [ "$FRONTEND_BUCKET" != "N/A" ] && [ -n "$FRONTEND_BUCKET" ]; then
            DISTRIBUTION_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Origins.Items[?DomainName=='${FRONTEND_BUCKET}.s3-website-${AWS_REGION}.amazonaws.com']].Id | [0]" \
              --output text)

            if [ "$DISTRIBUTION_ID" != "None" ] && [ -n "$DISTRIBUTION_ID" ]; then
              echo "Creating CloudFront invalidation for $DISTRIBUTION_ID..."
              aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
            fi
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "🌐 CloudFront URL: ${{ steps.deploy_outputs.outputs.cloudfront_url }}"
          echo "📡 API Gateway: ${{ steps.deploy_outputs.outputs.api_url }}"
          echo "🪣 Frontend Bucket: ${{ steps.deploy_outputs.outputs.frontend_bucket }}"
          echo "=========================================="

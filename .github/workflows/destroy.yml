name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      confirm:
        description: "Type the environment name to confirm destruction"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "❌ Confirmation does not match environment name!"
            echo "You entered: '${{ github.event.inputs.confirm }}'"
            echo "Expected: '${{ github.event.inputs.environment }}'"
            exit 1
          fi
          echo "✅ Destruction confirmed for ${{ github.event.inputs.environment }}"

      - name: 🔍 Debug GitHub OIDC Token & AWS STS
        run: |
          echo "=== 1. Requesting OIDC Token from GitHub Actions ==="
          RAW_RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          ID_TOKEN=$(echo "$RAW_RESPONSE" | jq -r '.value // empty')
          
          if [ -z "$ID_TOKEN" ]; then
            echo "❌ Failed to retrieve ID token from GitHub. Raw response: $RAW_RESPONSE"
          else
            echo "✅ ID Token received from GitHub."
            echo "=== 2. Decoded JWT Claims ==="
            echo "$ID_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref, environment}' || true
            
            echo "=== 3. Direct AWS CLI STS Test ==="
            aws sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::191990713407:role/github-actions-twin-deploy" \
              --role-session-name "DebugSession" \
              --web-identity-token "$ID_TOKEN" \
              --duration-seconds 900 \
              --region us-east-1 || true
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::191990713407:role/github-actions-twin-deploy' }}
          role-session-name: github-actions-destroy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Important: disable wrapper to get raw outputs

      - name: Run Destroy Script
        run: |
          # Set environment variables for the script
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION }}

          # Make script executable and run it
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh ${{ github.event.inputs.environment }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Destruction Complete
        run: |
          echo "✅ Environment ${{ github.event.inputs.environment }} has been destroyed!"

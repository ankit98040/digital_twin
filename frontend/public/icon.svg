<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Core Emblem Gradient -->
    <linearGradient id="coreGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Neural Orbit Ring (DevOps / Loop) -->
  <circle cx="32" cy="32" r="18" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Stylized AP Monogram & AI Nodes -->
  <g filter="url(#glow)">
    <!-- 'A' Structure -->
    <path d="M22 43L30.5 21C31.2 19.3 32.8 19.3 33.5 21L42 43" stroke="url(#coreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25.5 35H38.5" stroke="url(#coreGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- 'P' Loop Feature in Center -->
    <path d="M32 24H37.5C40.5 24 42.5 26 42.5 29C42.5 32 40.5 34 37.5 34H32" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Glowing Live Quantum / AI Dot -->
  <circle cx="46" cy="18" r="3.5" fill="#10B981" />
  <circle cx="46" cy="18" r="5.5" stroke="#10B981" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
